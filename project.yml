# XcodeGen spec: `xcodegen` regenerates unbraid.xcodeproj. The project file is generated, never edited by hand.
name: unbraid
options:
  bundleIdPrefix: app.unbraid
  deploymentTarget: { macOS: "26.0" }
  createIntermediateGroups: true
  groupSortPosition: top
# The signing team, bundle-ID prefix and release profiles, overridable in Config/Local.xcconfig.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    APP_GROUP: $(TeamIdentifierPrefix)$(BUNDLE_PREFIX)
  configs:
    # Development profiles grant the plain value; Developer ID ones only the system-extension value.
    Debug:
      NE_PROVIDER: packet-tunnel-provider
    Release:
      NE_PROVIDER: packet-tunnel-provider-systemextension
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O
targets:
  unbraid:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - path: Resources
        excludes: [Fonts, Catalog]
        buildPhase: resources
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
      # Bundled server lists, checked against App/Core/CatalogPin.swift (tools/update-catalog.sh).
      - path: Resources/Catalog
        type: folder
        buildPhase: resources
    dependencies:
      # No engine here: it runs in the tunnel extension, which the app reaches over XPC (App/Engine/EngineLink.swift).
      - target: UnbraidTunnel
        embed: true
        copy: { destination: plugins, subpath: ../Library/SystemExtensions }
      - target: UnbraidWidgets
        embed: true
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX)
        PRODUCT_NAME: unbraid
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/unbraid.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_APP_SANDBOX: NO
      # Release is signed for Developer ID by hand: only those profiles carry the system-extension VPN entitlement.
      configs:
        Release: { CODE_SIGN_STYLE: Manual, CODE_SIGN_IDENTITY: Developer ID Application, PROVISIONING_PROFILE_SPECIFIER: $(RELEASE_PROFILE_APP) }
  UnbraidTunnel:
    type: system-extension
    platform: macOS
    sources:
      - Tunnel
      - Shared/AppGroup.swift
      - Shared/Sealed.swift
      - Shared/Log.swift
      - Shared/Redact.swift
      - Shared/CommandXPCProtocol.swift
      - Shared/Fail.swift
      - Shared/ConfigVet.swift
      - Shared/Staging.swift
    dependencies:
      # A static library (gomobile): linked into the binary, nothing to embed.
      - framework: Frameworks/Libbox.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      # Go's macOS resolver calls libresolv (res_9_ninit, res_9_nsearch); upstream's own app links it too.
      - sdk: libresolv.tbd
    # The engine runs as root: refuse to build with a Libbox that isn't the one tools/build-libbox.sh recorded, whole
    # (headers, module map, plists) and from the patches in tools/. On every build, and outside the script sandbox
    # (this target's only script): it reads every file in the framework and tools/, which a sandboxed script can't
    # list, and Xcode wouldn't notice a changed file inside a folder anyway.
    preBuildScripts:
      - name: Verify engine
        script: '"$SRCROOT/tools/engine-manifest.sh" --check && touch "$DERIVED_FILE_DIR/engine-verified"'
        inputFiles: [$(SRCROOT)/tools/engine-manifest.sh, $(SRCROOT)/Frameworks/Libbox.sha256]
        outputFiles: [$(DERIVED_FILE_DIR)/engine-verified]
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).tunnel
        PRODUCT_NAME: $(BUNDLE_PREFIX).tunnel
        PRODUCT_MODULE_NAME: UnbraidTunnel
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_FILE: Tunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tunnel/Tunnel.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_APP_SANDBOX: YES
      configs:
        Release: { CODE_SIGN_STYLE: Manual, CODE_SIGN_IDENTITY: Developer ID Application, PROVISIONING_PROFILE_SPECIFIER: $(RELEASE_PROFILE_TUNNEL) }
  UnbraidWidgets:
    type: app-extension
    platform: macOS
    sources:
      - Widgets
      - Shared/AppGroup.swift
      - Shared/WidgetIntents.swift
      - Shared/Snapshot.swift
      - Shared/Palette.swift
      - Shared/Slash.swift
      - Shared/Units.swift
      - Shared/CountryFlag.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: AppIntents.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).widgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        ENABLE_APP_SANDBOX: YES
      # Its team-prefixed app group needs no profile.
      configs:
        Release: { CODE_SIGN_STYLE: Manual, CODE_SIGN_IDENTITY: Developer ID Application, PROVISIONING_PROFILE_SPECIFIER: "" }
  UnbraidTests:
    # Host-less: the core compiles straight into the test bundle, so tests never launch the app (or its extension).
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes: [Fixtures]
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
      - path: Resources/Catalog
        type: folder
        buildPhase: resources
      - App/Core
      - App/Providers
      - Shared/Fail.swift
      - Shared/Redact.swift
      - Shared/Log.swift
      - Shared/Sealed.swift
      - Shared/AppGroup.swift
      - Shared/Snapshot.swift
      - Shared/Units.swift
      - Shared/CountryFlag.swift
      - Shared/ConfigVet.swift
      - Shared/Staging.swift
      - Shared/CommandXPCProtocol.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  unbraid:
    build: { targets: { unbraid: all, UnbraidTests: [test] } }
    test: { targets: [UnbraidTests] }
  # Core logic only: builds and runs without the app, its extension or libbox.
  UnbraidTests:
    build: { targets: { UnbraidTests: [test] } }
    test: { targets: [UnbraidTests] }
